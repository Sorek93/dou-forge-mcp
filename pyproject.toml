[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dou-forge-mcp"
version = "0.1.0a4"
description = "A self-hosted, plan-first MCP control plane for user-owned machines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "PyJWT[crypto]>=2.10.1,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "build>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
douforge = "douforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
